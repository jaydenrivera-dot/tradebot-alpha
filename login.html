<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Robinhood AutoTrader</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 50%, rgba(46, 160, 67, 0.1) 0%, transparent 80%);
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .login-card .brand {
            justify-content: center;
            margin-bottom: 10px;
        }
        .login-card .brand h1 { font-size: 2rem; }
        .login-card .logo-icon { font-size: 2.5rem; }
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .login-subtitle {
            text-align: center;
            color: #8b949e;
            margin-bottom: 10px;
        }
        .text-center { text-align: center; }
        .back-link { color: #8b949e; text-decoration: none; font-size: 0.9rem; transition: color var(--transition-speed); }
        .back-link:hover { color: #fff; }
        .signup-link { color: var(--accent-color); text-decoration: none; font-weight: 600; }
        .signup-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-container app-container">
        <div class="login-card glass-panel">
            <div class="brand">
                <i class="fa-solid fa-chart-line logo-icon"></i>
                <h1>AutoTrader</h1>
            </div>
            <p class="login-subtitle">Sign in to your Robinhood portfolio</p>
            
            <!-- Added error message container -->
            <div id="login-error" style="display: none; background: rgba(218, 54, 51, 0.1); color: var(--danger-color); padding: 10px; border-radius: 8px; font-size: 0.9rem; text-align: center; border: 1px solid rgba(218, 54, 51, 0.3);"></div>
            
            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" id="login-submit-btn" class="btn-primary" style="margin-top: 16px;">Sign In</button>
            </form>
            
            <div class="text-center" style="margin-top: 20px;">
                <p style="color: #8b949e; font-size: 0.9rem; margin-bottom: 10px;">Don't have an account? <a href="signup.html" class="signup-link">Sign Up</a></p>
                <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
            </div>
        </div>
    </div>

    <!-- Connect Supabase custom authentication logic -->
    <script src="auth.js"></script>
</body>
</html>
